name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /renametool
          NEXT_PUBLIC_BASE_URL: https://iamshaoning.github.io/renametool
        run: pnpm build

      - name: Prepare root entry
        env:
          NEXT_PUBLIC_BASE_PATH: /renametool
        run: |
          # 根路径直接使用应用页面（移除官网首页）
          cp out/zh/app.html out/index.html
          # 官网首页改为跳转到根路径
          cat > out/zh.html <<EOF
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="utf-8">
          <title>Rename.Tools - 免费在线批量重命名工具</title>
          <meta http-equiv="refresh" content="0; url=${NEXT_PUBLIC_BASE_PATH}/">
          </head>
          <body>
          <script>window.location.replace("${NEXT_PUBLIC_BASE_PATH}/");</script>
          <p><a href="${NEXT_PUBLIC_BASE_PATH}/">跳转到 Rename.Tools</a></p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
